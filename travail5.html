<!DOCTYPE HTML>
<html lang="fr">
  <!-------------------------------------->
  <!-- HEAD : métadonnées + feuille CSS -->
  <!-------------------------------------->
  <head>
    <meta charset="UTF-8"> <!-- Encodage : évite les caractères “cassés” (accents, etc.) -->
    <title>Portfolio Florian Thyssen</title> <!-- Titre affiché dans l’onglet du navigateur -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Rend le site responsive (adaptation mobile/tablette) -->
    <link rel="stylesheet" type="text/css" href="style/app.css">
    <!-- CSS global du site (styles + animations + responsive) -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <!-- pour l'icone sur la fenetre en haut -->
  </head>

  

  <!-------------------------------------------->
  <!-- ARTICLE : contenu principal de la page -->
  <!-------------------------------------------->
  <article class="article">

    <!-- HERO : en-tête éditorial (kicker + titre) -->
    <div class="article__hero">
      <h1 class="article__title reveal-chars">Autres dessins</h1>
    </div>

    <!-- Paragraphes du corps :
         - .article__body = typographie + largeur de lecture
         - .fade-text = animation d’apparition quand l’élément entre dans le viewport -->
    <p class="article__body fade-text">
      C'est un ensemble de mes dessins personnels que j'ai réalisés ces dernières années sur tablette avec le logiciel Krita et sur iPad avec Procreate.
      Certaines illustrations sont également sur
      <a href="https://www.instagram.com/flox.san/" target="_blank" rel="noopener">
        mon compte Instagram.
        </a>
    </p>

    <div class="article__hero">
      <h1 class="article__title reveal-chars"></h1>
    </div>

        <img class="image" src="assets/image/dessins perso/dp3.png" alt="">

    <div class="image-grid">
        <img class="image" src="assets/image/dessins perso/dp1.png" alt="">
        <img class="image" src="assets/image/dessins perso/dp2.png" alt="">
        <img class="image" src="assets/image/dessins perso/dp4.png" alt="">
        <img class="image" src="assets/image/dessins perso/dp5.png" alt="">
        <img class="image" src="assets/image/dessins perso/dp6.png" alt="">
        <img class="image" src="assets/image/dessins perso/dp7.png" alt="">
        <img class="image" src="assets/image/dessins perso/dp8.png" alt="">
        <img class="image" src="assets/image/dessins perso/dp9.png" alt="">
        <img class="image" src="assets/image/dessins perso/dp10.png" alt="">
        <img class="image" src="assets/image/dessins perso/dp11.png" alt="">
        <img class="image" src="assets/image/dessins perso/dp12.png" alt="">
        <img class="image" src="assets/image/dessins perso/dp13.png" alt="">
        <img class="image" src="assets/image/dessins perso/dp14.png" alt="">
        <img class="image" src="assets/image/dessins perso/dp15.png" alt="">
        <img class="image" src="assets/image/dessins perso/dp16.png" alt="">
        <img class="image" src="assets/image/dessins perso/dp17.png" alt="">
    </div>

    <div class="liens-utiles">
      <a href="index.html" class="bouton-lien">Retour</a><br />
    </div>

  </article>

  </div>

  <!-------------------------------------->
  <!-- FOOTER : crédits -->
  <!-------------------------------------->
  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner">
      <p class="footer-credits">
        © 2026 —
        <a href="https://canva.link/n2it55j9n6t19z7" target="_blank" rel="noopener">
        Florian Thyssen
        </a>
      </p>
    </div>
  </footer>

  <!-------------------------------------->
  <!-- SCRIPTS -->
  <!-------------------------------------->
  <!-- fade-images.js :
       gère les animations (.fade-text, .fade-block, .reveal-chars, etc.) via IntersectionObserver -->
  <script defer src="js/fade-images.js"></script>

  <!-- menu.js :
       gère l’ouverture/fermeture du menu hamburger en mobile
       (ajoute/retire .is-menu-open sur le header, met à jour aria-expanded, etc.) -->
  <script defer src="js/menu.js"></script>

</body>
</html>
